
name: Build NEXORA Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          unzip -t deploy.zip
          mkdir project
          unzip deploy.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f

      - name: Verify PWA files
        run: |
          find project -name "manifest.webmanifest"
          find project -name "index.html"
          find project -name "sw.js"
